<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Primary Meta Tags -->
<title id="metaTitle">{{title}}</title>
<meta name="title" content="{{title}}">
<meta name="description" content="{{description}}">
<meta name="author" content="AGNEX Technology">
<link rel="canonical" href="https://agnextechnology.com{{path}}">

<!-- Brand Favicon & Icons -->
<link rel="icon" type="image/svg+xml" href="/brand/agnex-favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://agnextechnology.com{{path}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="AGNEX Technology">
<meta property="og:image" content="https://agnextechnology.com/brand/agnex-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter / X -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://agnextechnology.com{{path}}">
<meta property="twitter:title" content="{{title}}">
<meta property="twitter:description" content="{{description}}">
<meta property="twitter:image" content="https://agnextechnology.com/brand/agnex-og.png">

<!-- Google Fonts: Space Grotesk & Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- PWA Manifest & App Icons -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B0D10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AGNEX">

<!-- Structured Data (Schema.org JSON-LD for AGNEX Technology) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://agnextechnology.com/#organization",
      "name": "AGNEX Technology",
      "url": "https://agnextechnology.com/",
      "logo": "https://agnextechnology.com/brand/agnex-logo.png",
      "image": "https://agnextechnology.com/brand/agnex-og.png",
      "slogan": "Engineering What's Next.",
      "description": "AGNEX is a technology and engineering company that transforms ideas and business challenges into practical digital solutions.",
      "telephone": "+91 75983 41607",
      "sameAs": [
        "https://www.linkedin.com/company/agnex-technology",
        "https://www.instagram.com/agnextechnology"
      ],
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+91 75983 41607",
          "contactType": "customer service"
        }
      ]
    },
    {
      "@type": "WebSite",
      "@id": "https://agnextechnology.com/#website",
      "url": "https://agnextechnology.com/",
      "name": "AGNEX Technology",
      "publisher": {
        "@id": "https://agnextechnology.com/#organization"
      }
    }
  ]
}
</script>
