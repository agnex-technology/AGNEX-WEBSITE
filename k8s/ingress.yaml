# Phase 112/113 — Kubernetes Ingress (NGINX Ingress Controller)
# Phase 113 — API Gateway policies applied via annotations
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vantrex-api-ingress
  namespace: vantrex
  labels:
    app.kubernetes.io/name: vantrex-api
    app.kubernetes.io/component: ingress
  annotations:
    # TLS / HTTPS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # NGINX rate limiting (Phase 113 — API Gateway)
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # Request body size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://agnex.tech"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' https://trusted-cdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.agnex.tech; frame-ancestors 'none'; object-src 'none';";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.agnex.tech
      secretName: vantrex-api-tls
  rules:
    - host: api.agnex.tech
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vantrex-api
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: vantrex-api
                port:
                  number: 80
