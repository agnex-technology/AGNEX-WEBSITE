# Phase 112/114 — Network Policy
# Deny all ingress/egress by default; allow only necessary traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vantrex-api-netpol
  namespace: vantrex
  labels:
    app.kubernetes.io/name: vantrex-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vantrex-api
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from NGINX Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 5000
          protocol: TCP
    # Allow traffic from Istio control plane (Phase 114)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    # Allow traffic from within the vantrex namespace (inter-service)
    - from:
        - podSelector: {}

  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow PostgreSQL (internal or managed DB)
    - ports:
        - port: 5432
          protocol: TCP
    # Allow Redis
    - ports:
        - port: 6379
          protocol: TCP
    # Allow HTTPS external (AI APIs, webhooks)
    - ports:
        - port: 443
          protocol: TCP
