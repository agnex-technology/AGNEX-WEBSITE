# Phase 114 — Istio DestinationRule
# Defines traffic policies, mTLS, load balancing, and connection pool settings
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: vantrex-api
  namespace: vantrex
spec:
  host: vantrex-api
  # Phase 114 — Mutual TLS (mTLS) between all services
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
      tcp:
        maxConnections: 100
    loadBalancer:
      simple: LEAST_CONN
    # Circuit Breaker (Istio-native, complements Phase 113 app-layer breaker)
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: stable
      labels:
        release: stable
    - name: canary
      labels:
        release: canary
      trafficPolicy:
        connectionPool:
          http:
            http1MaxPendingRequests: 10
