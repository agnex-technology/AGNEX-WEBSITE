# Phase 114 — Istio PeerAuthentication
# Enforce strict mTLS within the vantrex namespace
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: vantrex-mtls-strict
  namespace: vantrex
spec:
  mtls:
    mode: STRICT
---
# Istio Gateway (ingress)
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: vantrex-gateway
  namespace: vantrex
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: vantrex-api-tls
      hosts:
        - api.agnex.tech
    - port:
        number: 80
        name: http
        protocol: HTTP
      tls:
        httpsRedirect: true
      hosts:
        - api.agnex.tech
