# Phase 114 — Istio VirtualService
# Controls traffic routing, retries, timeouts, and canary splits
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: agnex-api
  namespace: agnex
spec:
  hosts:
    - agnex.tech
    - www.agnex.tech
    - api.agnex.tech
    - agnex-api
    - agnex-frontend
  gateways:
    - agnex-gateway
    - mesh
  http:
    # Phase 117 — Canary Release: 95% stable / 5% canary
    - match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: agnex-api
            subset: canary
          weight: 100

    # API Traffic Routing
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: agnex-api
            subset: stable
          weight: 95
        - destination:
            host: agnex-api
            subset: canary
          weight: 5
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: "gateway-error,connect-failure,retriable-4xx"

    # Frontend Traffic Routing
    - route:
        - destination:
            host: agnex-frontend
            port:
              number: 80
      fault:
        # Phase 119 — SRE: Fault injection for chaos engineering (disabled in prod)
        # abort:
        #   httpStatus: 500
        #   percentage:
        #     value: 1
