# Phase 112 — ConfigMap (non-secret environment variables)
apiVersion: v1
kind: ConfigMap
metadata:
  name: agnex-api-config
  namespace: agnex
  labels:
    app.kubernetes.io/name: agnex-api
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PORT: "5000"
  LOG_LEVEL: "info"
  SHUTDOWN_TIMEOUT_MS: "10000"
  APP_VERSION: "1.0.0"
  CORS_ORIGIN: "https://agnex.tech"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"
