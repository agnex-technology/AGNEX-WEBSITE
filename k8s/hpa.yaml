# Phase 112 — Horizontal Pod Autoscaler
# Auto-scale API pods between 3 and 20 replicas based on CPU/Memory
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agnex-api-hpa
  namespace: agnex
  labels:
    app.kubernetes.io/name: agnex-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agnex-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
