# Phase 112 — Kubernetes Service
apiVersion: v1
kind: Service
metadata:
  name: agnex-api
  namespace: agnex
  labels:
    app.kubernetes.io/name: agnex-api
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: agnex-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
  type: ClusterIP
