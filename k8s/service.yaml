# Phase 112 — Kubernetes Service
apiVersion: v1
kind: Service
metadata:
  name: vantrex-api
  namespace: vantrex
  labels:
    app.kubernetes.io/name: vantrex-api
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: vantrex-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
  type: ClusterIP
