apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agnex-api-secrets
  namespace: agnex
spec:
  refreshInterval: "1h"
  secretStoreRef:
    # This assumes a SecretStore or ClusterSecretStore named 'vault-backend' is configured
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agnex-api-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: agnex/production/api
