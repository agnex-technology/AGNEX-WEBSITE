apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vantrex-api-secrets
  namespace: vantrex
spec:
  refreshInterval: "1h"
  secretStoreRef:
    # This assumes a SecretStore or ClusterSecretStore named 'vault-backend' is configured
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vantrex-api-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: vantrex/production/api
